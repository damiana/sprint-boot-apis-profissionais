spring.application.name=runner-circle-api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:runnercircle}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html

runnercircle.upload.dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

runnercircle.jwt.secret=${JWT_SECRET}
runnercircle.jwt.expiracao-padrao=${JWT_EXPIRATION:3600000}
runnercircle.jwt.expiracao-lembrar-me=${JWT_EXPIRATION_REMEMBER_ME:2592000000}
